<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Practice Form</title></head>
<body>
  <form>
    <div><label for="state-last">State</label><select id="state-last" name="region">
      <option>-- Select --</option><option>Karnataka</option><option>Kerala</option>
    </select></div>
    <div>
      <strong>Gender</strong>
      <p>
        <input type="radio" name="sex" value="m"><span>Male</span>
        <input type="radio" name="sex" value="f"><span>Female</span>
        <input type="radio" name="sex" value="t"><span>Transgender</span>
      </p>
    </div>
    <div><label for="given-last">First Name</label><input id="given-last" type="text" name="first"></div>
  </form>
</body>
</html>
