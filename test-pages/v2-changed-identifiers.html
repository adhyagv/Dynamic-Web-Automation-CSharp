<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Practice Form</title></head>
<body>
  <form>
    <section><label for="person-given">First Name</label><input id="person-given" type="text" name="given"></section>
    <section>
      <p>Gender</p>
      <div>
        <input type="radio" name="identity-choice" value="m"><span>Male</span>
        <input type="radio" name="identity-choice" value="f"><span>Female</span>
        <input type="radio" name="identity-choice" value="x"><span>Transgender</span>
      </div>
    </section>
    <section><label for="region-choice">State</label><select id="region-choice" name="region">
      <option>-- Select --</option><option>Karnataka</option><option>Kerala</option>
    </select></section>
  </form>
</body>
</html>
