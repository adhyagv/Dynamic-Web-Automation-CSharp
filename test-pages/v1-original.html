<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Practice Form</title></head>
<body>
  <form>
    <div><label for="first-name">First Name</label><input id="first-name" type="text" name="First Name"></div>
    <div>
      <label>Gender</label>
      <div>
        <input type="radio" name="gender" value="Male"><span>Male</span>
        <input type="radio" name="gender" value="Female"><span>Female</span>
        <input type="radio" name="gender" value="Transgender"><span>Transgender</span>
      </div>
    </div>
    <div><label for="state">State</label><select id="state" name="State">
      <option value="">-- Select --</option><option> Karnataka </option><option>Kerala</option>
    </select></div>
  </form>
</body>
</html>
