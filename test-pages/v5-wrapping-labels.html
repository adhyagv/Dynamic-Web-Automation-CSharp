<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Practice Form</title></head>
<body>
  <form>
    <div class="field"><label>First Name <input type="text" name="person-given"></label></div>
    <fieldset>
      <legend>Gender</legend>
      <label><input type="radio" name="profile-choice" value="m">Male</label>
      <label><input type="radio" name="profile-choice" value="f">Female</label>
      <label><input type="radio" name="profile-choice" value="t">Transgender</label>
    </fieldset>
    <div class="field"><label>State <select name="person-region">
      <option>-- Select --</option><option>Karnataka</option><option>Kerala</option>
    </select></label></div>
  </form>
</body>
</html>
