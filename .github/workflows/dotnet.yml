name: .NET

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore CloudQaAutomation.slnx

      - name: Build solution
        run: dotnet build CloudQaAutomation.slnx --configuration Release --no-restore

      - name: Run complete xUnit suite
        run: dotnet test CloudQaAutomation.slnx --configuration Release --no-build --logger "console;verbosity=normal"
